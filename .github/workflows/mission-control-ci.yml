name: Mission Control CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: mission-control-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, migrations and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: growth_group_internal_crm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: growth_group_internal_crm
      JWT_SECRET: ci-only-secret-at-least-32-characters
      BACKGROUND_JOBS_ENABLED: "false"
      WHATSAPP_PROVIDER: log
      GOOGLE_DRIVE_VALIDATION_MODE: mocked
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Load base database schema
        run: mysql -h 127.0.0.1 -uroot -proot growth_group_internal_crm < db.sql

      - name: Run migrations
        run: npm run db:migrate

      - name: Build backend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../backend-build.log

      - name: Run backend smoke/database tests
        run: |
          set -o pipefail
          npm run test:smoke 2>&1 | tee ../backend-test.log

      - name: Validate Scoro import templates
        run: |
          set -o pipefail
          npm run validate:scoro-import 2>&1 | tee ../scoro-template-validation.log

      - name: Upload backend CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-artifacts
          path: |
            backend-build.log
            backend-test.log
            scoro-template-validation.log
          retention-days: 14

  frontend:
    name: Frontend typecheck, lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check API/provider secrets are not public
        working-directory: .
        run: |
          set -o pipefail
          node scripts/assert-no-public-lead-api-secret.mjs 2>&1 | tee lead-api-secret-check.log

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ../frontend-typecheck.log

      - name: Lint frontend
        run: |
          set -o pipefail
          node --max-old-space-size=4096 ./node_modules/eslint/bin/eslint.js app components hooks lib 2>&1 | tee ../frontend-lint.log

      - name: Run frontend unit tests
        run: |
          set -o pipefail
          npm run test 2>&1 | tee ../frontend-test.log

      - name: Build frontend production bundle
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../frontend-build.log

      - name: Upload frontend CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-artifacts
          path: |
            frontend-typecheck.log
            frontend-lint.log
            frontend-test.log
            frontend-build.log
            lead-api-secret-check.log
            frontend/.next
          retention-days: 14

  browser-smoke:
    name: Playwright browser smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - frontend
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
      PLAYWRIGHT_USER_EMAIL: ${{ secrets.PLAYWRIGHT_USER_EMAIL }}
      PLAYWRIGHT_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: List smoke coverage
        run: npm run test:e2e:smoke:list

      - name: Run desktop and mobile browser smoke
        if: env.PLAYWRIGHT_BASE_URL != '' && env.PLAYWRIGHT_USER_EMAIL != '' && env.PLAYWRIGHT_USER_PASSWORD != ''
        run: npm run test:e2e:smoke

      - name: Note missing target credentials
        if: env.PLAYWRIGHT_BASE_URL == '' || env.PLAYWRIGHT_USER_EMAIL == '' || env.PLAYWRIGHT_USER_PASSWORD == ''
        run: |
          {
            echo "Playwright smoke suite was listed, but authenticated execution is waiting on PLAYWRIGHT_BASE_URL and smoke-test credentials."
            echo "This preserves the CI hook without inventing staging credentials."
          } | tee ../playwright-smoke-gated.log

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            playwright-smoke-gated.log
          retention-days: 14

  release-review:
    name: Release review summary
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - browser-smoke
    if: always()
    steps:
      - name: Write CI summary
        run: |
          {
            echo "## Mission Control CI"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Backend build, migrations and database tests | ${{ needs.backend.result }} |"
            echo "| Frontend typecheck, lint, tests and production build | ${{ needs.frontend.result }} |"
            echo "| Playwright browser smoke suite | ${{ needs.browser-smoke.result }} |"
            echo ""
            echo "Artifacts are retained for 14 days for release review."
            echo "Branch protection should require both backend and frontend jobs before merge."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if required jobs failed
        if: needs.backend.result != 'success' || needs.frontend.result != 'success' || needs.browser-smoke.result != 'success'
        run: exit 1
